name: Roohu ClipForge APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Roohu-ClipForge-M28.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install a modern Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Extract and locate Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f Roohu-ClipForge-M28.zip
          mkdir -p extracted
          unzip -q Roohu-ClipForge-M28.zip -d extracted
          echo "Extracted project files:"
          find extracted -maxdepth 5 -type f | sort | head -250
          PROJECT_DIR="$(find extracted -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found in ZIP."
            exit 1
          fi
          if ! find "$PROJECT_DIR" -maxdepth 2 -type f \\( -name build.gradle -o -name build.gradle.kts \\) | grep -q .; then
            echo "::error::Gradle build files were not found beside the settings file."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"
          echo "Gradle version:"
          gradle --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null || true
          else
            echo "sdkmanager is not on PATH; Gradle will use the runner Android SDK."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::Gradle completed but no APK was found."
            exit 1
          fi
          printf 'Generated APK: %s\n' "${APKS[@]}"
          mkdir -p release-apk
          cp "${APKS[0]}" release-apk/Roohu-ClipForge-debug.apk
          ls -lh release-apk/Roohu-ClipForge-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roohu-ClipForge-debug-APK
          path: release-apk/Roohu-ClipForge-debug.apk
          if-no-files-found: error
          retention-days: 14
